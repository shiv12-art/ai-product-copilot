<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Product Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 AI Product Assistant</h1>
            <p>Transform your product idea into a complete development plan</p>
        </header>

        <main>
            <section class="input-section">
                <form id="productForm">
                    <div class="form-group">
                        <label for="apiKey">Claude API Key:</label>
                        <input
                            type="password"
                            id="apiKey"
                            placeholder="sk-ant-..."
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="problemStatement">Problem Statement / Product Idea:</label>
                        <textarea
                            id="problemStatement"
                            rows="5"
                            placeholder="Describe your product idea or the problem you're solving..."
                            required
                        ></textarea>
                    </div>

                    <button type="submit" class="btn-primary">Generate Product Plan</button>
                </form>
            </section>

            <section class="output-section" id="outputSection" style="display: none;">
                <div class="loading" id="loading" style="display: none;">
                    <div class="spinner"></div>
                    <p>Generating your product plan...</p>
                </div>

                <div id="output" class="output-content"></div>

                <button type="button" class="btn-secondary" onclick="resetForm()">New Plan</button>
            </section>

            <div id="error" class="error-message"></div>
        </main>

        <footer>
            <p>Simple POC • Powered by Claude AI</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
